name: docker-pack-n-push

# Reusable workflow: збирає Docker-образ і публікує його в Docker Hub
# або (якщо push = false) зберігає образ як артефакт workflow.
on:
  workflow_call:
    inputs:
      repository:
        description: 'Репозиторій у Docker Hub, наприклад arrow06/items-api-gha'
        type: string
        required: true
      tag:
        description: 'Тег образу'
        type: string
        default: 'latest'
      push:
        description: 'true - публікувати в Docker Hub, false - зберегти як артефакт'
        type: boolean
        default: false
      dockerfile:
        description: 'Шлях до Dockerfile'
        type: string
        default: 'Dockerfile'
      context:
        description: 'Контекст збирання'
        type: string
        default: '.'
      artifact-retention-days:
        description: 'Скільки днів зберігати артефакт з образом'
        type: number
        default: 7
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:
  docker-pack-n-push:
    name: docker-pack-n-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub
        if: ${{ inputs.push }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.repository }}:${{ inputs.tag }}
          push: true

      - name: Build image to archive
        if: ${{ !inputs.push }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.repository }}:${{ inputs.tag }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar

      - name: Upload image as workflow artifact
        if: ${{ !inputs.push }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ runner.temp }}/image.tar
          retention-days: ${{ inputs.artifact-retention-days }}
