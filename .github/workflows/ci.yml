name: CI

on:
  push:
    branches:
      - master
      - 'feature/*'
      - 'bugfix/*'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build-n-test:
    name: build-n-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and run unit tests
        run: ./mvnw -B clean package

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: target/surefire-reports/

  build-migrator:
    name: build-migrator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build migrator
        run: ./mvnw -B -f migrator/pom.xml clean package

  build-backup-controller:
    name: build-backup-controller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build backup controller
        run: ./mvnw -B -f backup-controller/pom.xml clean package

  build-frontend:
    name: build-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

  helm-lint-n-package:
    name: helm-lint-n-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint chart
        run: |
          helm lint --strict k8s/items-app
          helm lint --strict k8s/items-app -f k8s/values.lab.yaml

      - name: Package chart
        run: helm package k8s/items-app --destination dist

      - name: Upload chart
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: dist/*.tgz

  docker-api:
    needs: build-n-test
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: arrow06/items-api-gha
      tag: latest
      push: ${{ github.ref == 'refs/heads/master' }}
      artifact-name: docker-image-api
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-frontend:
    needs: build-frontend
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: arrow06/items-frontend
      tag: latest
      context: frontend
      dockerfile: frontend/Dockerfile
      push: ${{ github.ref == 'refs/heads/master' }}
      artifact-name: docker-image-frontend
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-migrator:
    needs: build-migrator
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: arrow06/items-migrator
      tag: latest
      context: migrator
      dockerfile: migrator/Dockerfile
      push: ${{ github.ref == 'refs/heads/master' }}
      artifact-name: docker-image-migrator
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  docker-backup-controller:
    needs: build-backup-controller
    uses: ./.github/workflows/docker-pack-n-push.yml
    with:
      repository: arrow06/databasebackup-controller
      tag: latest
      context: backup-controller
      dockerfile: backup-controller/Dockerfile
      push: ${{ github.ref == 'refs/heads/master' }}
      artifact-name: docker-image-backup-controller
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
