# Профіль для Code-First генерації SQL-схеми з JPA-сутностей (Hibernate, діалект PostgreSQL).
# Запуск: ./mvnw test -Dtest=Lab1ApplicationTests -DargLine="-Dspring.profiles.active=schema"
# Результат: target/generated-schema.sql -> копіюється як нова міграція в migrator/src/main/resources/db/migration/
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.delimiter=;
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.action=create
spring.jpa.properties.jakarta.persistence.schema-generation.scripts.create-target=target/generated-schema.sql
