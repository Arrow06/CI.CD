spring.application.name=Lab1

# Підключення до бази даних. Значення для кожного середовища передаються
# змінними оточення (у Kubernetes - з ConfigMap і Secret Helm chart).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/items}
spring.datasource.username=${DB_USER:items}
spring.datasource.password=${DB_PASSWORD:items}

# Схему створює окремий застосунок міграцій (migrator).
# Сервер лише перевіряє, що схема бази відповідає JPA-сутностям.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
