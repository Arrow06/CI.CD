apiVersion: v1
kind: Pod
metadata:
  name: restore-check
  namespace: demo
spec:
  restartPolicy: Never
  containers:
    - name: psql
      image: postgres:17-alpine
      command: ["sleep", "3600"]
      envFrom:
        - secretRef:
            name: users-db-connection
      volumeMounts:
        - name: backups
          mountPath: /backups
          readOnly: true
  volumes:
    - name: backups
      persistentVolumeClaim:
        claimName: postgres-backups
