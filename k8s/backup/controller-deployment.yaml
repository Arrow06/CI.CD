apiVersion: apps/v1
kind: Deployment
metadata:
  name: databasebackup-controller
  namespace: demo
  labels:
    app.kubernetes.io/name: databasebackup-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: databasebackup-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: databasebackup-controller
    spec:
      serviceAccountName: databasebackup-controller
      containers:
        - name: controller
          image: arrow06/databasebackup-controller:latest
          imagePullPolicy: Always
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: BACKUP_IMAGE
              value: postgres:17-alpine
            - name: RESYNC_SECONDS
              value: "60"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
