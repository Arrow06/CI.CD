apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databasebackups.backup.example.com
spec:
  group: backup.example.com
  scope: Namespaced
  names:
    kind: DatabaseBackup
    listKind: DatabaseBackupList
    plural: databasebackups
    singular: databasebackup
    shortNames:
      - dbbackup
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - schedule
                - connectionSecretName
                - backupPVCName
              properties:
                schedule:
                  type: string
                  minLength: 1
                timeZone:
                  type: string
                  minLength: 1
                  default: Etc/UTC
                connectionSecretName:
                  type: string
                  minLength: 1
                backupPVCName:
                  type: string
                  minLength: 1
      additionalPrinterColumns:
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: TimeZone
          type: string
          jsonPath: .spec.timeZone
        - name: Secret
          type: string
          jsonPath: .spec.connectionSecretName
        - name: PVC
          type: string
          jsonPath: .spec.backupPVCName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
