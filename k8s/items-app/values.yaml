# Значення за замовчуванням для chart items-app.
# Налаштування конкретного середовища задаються окремим файлом, наприклад values.lab.yaml.

nameOverride: ""
fullnameOverride: ""

# Backend: Spring Boot REST API (/api/items)
api:
  image:
    repository: arrow06/items-api-gha
    tag: latest
    pullPolicy: Always
  replicas: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Frontend: React-застосунок, який роздає nginx
frontend:
  image:
    repository: arrow06/items-frontend
    tag: latest
    pullPolicy: Always
  replicas: 1
  containerPort: 80
  service:
    type: ClusterIP
    port: 80
  # Адреса API для браузера. Порожньо = той самий хост, що й сторінка (запити /api йдуть через Ingress).
  apiBaseUrl: ""
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi

# Job, що застосовує міграції до бази даних (консольний застосунок migrator)
migration:
  enabled: true
  image:
    repository: arrow06/items-migrator
    tag: latest
    pullPolicy: Always
  backoffLimit: 4
  # Скільки разів мігратор пробує підключитися до бази (раз на секунду), поки вона стартує
  connectRetries: 120

# База даних PostgreSQL (StatefulSet + PersistentVolumeClaim)
database:
  image:
    repository: postgres
    tag: 17-alpine
    pullPolicy: IfNotPresent
  port: 5432
  name: items
  user: items
  # Пароль зберігається в Secret. Для реальних середовищ передавайте його через --set або окремий values-файл.
  password: change-me
  persistence:
    size: 1Gi
    accessMode: ReadWriteOnce
    # Окремий StorageClass для бази даних
    storageClass:
      create: true
      name: items-db-sc
      provisioner: rancher.io/local-path
      reclaimPolicy: Delete
      volumeBindingMode: WaitForFirstConsumer
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Ingress: /api -> backend, / -> frontend
ingress:
  enabled: true
  className: nginx
  host: items.local
