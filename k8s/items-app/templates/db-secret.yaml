apiVersion: v1
kind: Secret
metadata:
  name: {{ include "items-app.dbSecretName" . }}
  labels:
    {{- include "items-app.componentLabels" (dict "root" . "component" "database") | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
