apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "items-app.fullname" . }}-test-connection"
  labels:
    {{- include "items-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  containers:
    - name: wget
      image: busybox:1.37
      command: ['sh', '-c']
      args:
        - >-
          wget -qO- http://{{ include "items-app.apiName" . }}:{{ .Values.api.service.port }}/api/items &&
          wget -qO- http://{{ include "items-app.frontendName" . }}:{{ .Values.frontend.service.port }}/ > /dev/null &&
          echo "api and frontend are reachable"
  restartPolicy: Never
