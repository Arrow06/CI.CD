{{- if .Values.migration.enabled }}
# Job міграцій. Номер ревізії release в імені: при кожному helm upgrade створюється новий Job,
# який застосовує нові міграції (вже застосовані Flyway пропускає).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "items-app.migrationName" . }}-{{ .Release.Revision }}
  labels:
    {{- include "items-app.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "items-app.componentSelectorLabels" (dict "root" . "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.migration.image.pullPolicy }}
          env:
            - name: DB_CONNECT_RETRIES
              value: {{ .Values.migration.connectRetries | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "items-app.apiName" . }}-cm
            - secretRef:
                name: {{ include "items-app.dbSecretName" . }}
{{- end }}
