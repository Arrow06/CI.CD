{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "items-app.fullname" . }}
  labels:
    {{- include "items-app.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # REST API та документація OpenAPI -> backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "items-app.apiName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: {{ include "items-app.apiName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "items-app.apiName" . }}
                port:
                  number: {{ .Values.api.service.port }}
          # Усе інше -> frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "items-app.frontendName" . }}
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
