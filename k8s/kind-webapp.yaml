# Локальний кластер kind для Лабораторної №4: одна нода з NGINX Ingress на порту 80 хоста.
# Створення: kind create cluster --config k8s/kind-webapp.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: webapp
nodes:
  - role: control-plane
    labels:
      ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
